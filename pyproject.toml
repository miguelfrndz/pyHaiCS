[project]
name = "pyhaics"
version = "0.0.2"
description = "Python Library for Hamiltonian Markov-Chain Monte Carlo in Computational Statistics (pyHaiCS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imbalanced-learn>=0.13.0",
    "jax<0.5",
    "matplotlib>=3.10.3",
    "pandas>=2.2.3",
    "pillow>=12.2.0",
    "scikit-learn>=1.6.1",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyHaiCS*"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
