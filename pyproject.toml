[project]
name = "pyhaics"
version = "0.0.1"
description = "Python Library for Hamiltonian Markov-Chain Monte-Carlo in Computational Statistics (pyHaiCS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imbalanced-learn>=0.13.0",
    "jax<0.5",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["pyHaiCS"]
